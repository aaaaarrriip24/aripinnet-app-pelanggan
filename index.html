<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!--
    viewport-fit=cover + user-scalable=no: standar untuk WebView aplikasi.
    Tanpa user-scalable=no, dobel-ketuk di Android akan memperbesar layar
    dan aplikasi terasa seperti halaman web, bukan aplikasi.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Billing Internet</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
